# Local LLM Router & Cache Proxy - Configuration Example
# Copy to router.yaml and adjust according to your setup.

server:
  host: 127.0.0.1
  port: 8000
  workers: 1
  log_level: info

cache:
  enabled: true
  db_path: data/cache.db
  ttl_seconds: 86400  # 24 hours. Set to 0 for infinite caching.
  max_entries: 10000  # LRU eviction limit
  normalize_whitespace: true

validator:
  enabled: true
  max_retries: 3
  strip_markdown: true

routing:
  default_route: slm
  # Length-based routing: prompts <= 250 tokens go to fast local SLM, > 250 to cloud Heavy model
  length_threshold_tokens: 250
  slm_target: ollama:llama3.2:1b
  heavy_target: openai:gpt-4o-mini
  
  # Tag-based routing: route based on X-Task-Tag header or request tags
  tags:
    fast: slm
    code: ollama:qwen2.5-coder
    reasoning: openai:gpt-4o
    heavy: heavy

  # Aliases: user can request model="slm" or model="fast"
  aliases:
    slm: ollama:llama3.2:1b
    heavy: openai:gpt-4o-mini
    default: ollama:llama3.2:1b
    fast: ollama:llama3.2:1b

  # Fallback chains: if primary model fails with timeout, network error, 5xx or token limit
  fallback_chains:
    default:
      - ollama:llama3.2:1b
      - openai:gpt-4o-mini
      - mock:fallback

providers:
  - name: ollama
    type: ollama
    base_url: http://localhost:11434
    default_model: llama3.2:1b
    timeout_seconds: 30.0
    models:
      - llama3.2:1b
      - qwen2.5-coder

  - name: llamacpp
    type: llama_cpp
    base_url: http://localhost:8080
    default_model: local-model
    timeout_seconds: 60.0

  - name: openai
    type: openai_compatible
    base_url: https://api.openai.com/v1
    api_key: "${OPENAI_API_KEY}"
    default_model: gpt-4o-mini
    timeout_seconds: 30.0
    models:
      - gpt-4o-mini
      - gpt-4o

  - name: mock
    type: mock
    default_model: mock-model
    models:
      - mock-model
      - fallback
