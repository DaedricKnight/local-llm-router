[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-llm-router"
version = "0.1.0"
description = "Local LLM/SLM router and semantic caching proxy with OpenAI-compatible API, JSON Schema validation, and fallback policies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Artem Khateev", email = "artem.khateev@gmail.com" }
]
keywords = [
    "llm",
    "slm",
    "proxy",
    "router",
    "caching",
    "fallback",
    "ollama",
    "llama.cpp",
    "openai",
    "fastapi",
    "typer"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "typer>=0.12.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "jsonschema>=4.21.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[project.scripts]
local-llm-router = "local_llm_router.cli.main:app"
llm-router = "local_llm_router.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/local_llm_router"]

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "E501"]
